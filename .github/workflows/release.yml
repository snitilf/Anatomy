name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run schema && git diff --exit-code -- schema/
      - name: Install Chrome if missing
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
      - name: Browser tests
        run: npx playwright test 'e2e/(?!performance\.spec\.ts).*\.spec\.ts' --reporter=list,html
      - name: Upload browser results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Package release
        run: |
          npm run build
          cat > README-run.txt <<'INSTRUCTIONS'
          Start the app from this directory with:
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist
          Open http://127.0.0.1:4173 in your browser.
          Repository folder access requires Chrome or Edge.
          INSTRUCTIONS
          zip -qr anatomy.zip dist README-run.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" anatomy.zip --generate-notes
