name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag against package.json and the release notes
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi
          if [ ! -f "docs/release-notes/$version.md" ]; then
            echo "::error::There is no docs/release-notes/$version.md."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run schema && git diff --exit-code -- schema/
      - name: Install Chrome if missing
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
      - name: Browser tests
        run: npx playwright test 'e2e/(?!performance\.spec\.ts).*\.spec\.ts' --reporter=list,html
      - name: Upload browser results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      # The browser tests build the app in the e2e mode into dist, so the release is built again, clean, before it is packaged.
      - name: Package release
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run build
          node scripts/package-release.ts
          (cd release && zip -qr "../anatomy-$version.zip" "anatomy-$version")
      - name: Check that the zip runs
        run: |
          version="${GITHUB_REF_NAME#v}"
          unzip -q "anatomy-$version.zip" -d unzipped
          cd "unzipped/anatomy-$version"
          node serve.mjs 4173 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 10 --retry-connrefused --retry-delay 1 --output page.html http://127.0.0.1:4173/
          grep -q '<title>Anatomy</title>' page.html
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "anatomy-$version.zip" --verify-tag --title "Anatomy $version" --notes-file "docs/release-notes/$version.md"
