name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run schema && git diff --exit-code -- schema/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome if missing
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
      - name: Browser tests
        run: npx playwright test 'e2e/(?!performance\.spec\.ts).*\.spec\.ts' --reporter=list,html
      - name: Upload browser results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  performance:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome if missing
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
      - name: Performance tests
        id: performance
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: performance-results.json
        run: npx playwright test e2e/performance.spec.ts --workers=1 --reporter=list,json
      - name: Summarize performance
        if: always()
        env:
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          node .github/scripts/performance-summary.cjs >> "$GITHUB_STEP_SUMMARY"
          if [ "$PERFORMANCE_OUTCOME" = failure ]; then
            echo '::warning::The frame-time gate did not hold on the hosted runner and must be confirmed locally with npx playwright test e2e/performance.spec.ts --workers=1 before merging.'
          fi
